[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smithy-engine"
version = "0.7.0"
description = "Free Python RPA engine — create automation bots with simple API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "as-kurosss" }]
dependencies = []

[project.optional-dependencies]
windows = ["uiautomation>=2.0.29", "mss>=9", "Pillow>=10", "pyperclip>=1.8"]
capture = ["pynput>=1.7", "pyperclip>=1.8"]
image = ["mss>=9", "Pillow>=10", "numpy>=1.24", "opencv-python>=4.8"]
excel = ["openpyxl>=3.1"]
all = [
    "uiautomation>=2.0.29",
    "mss>=9",
    "Pillow>=10",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smithy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["TC001", "TC003"]

[tool.ruff.lint.per-file-ignores]
"src/smithy/core/errors.py" = ["N818"]
"src/smithy/windows/tools/screenshot.py" = ["A002"]
"src/smithy/windows/tools/selector_capture/api.py" = ["N818"]
"tests/windows/test_process_lifecycle.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
# the package targets Windows (ctypes.windll etc.); type-check for win32
platform = "win32"

[[tool.mypy.overrides]]
module = ["pynput.*", "pyperclip", "mss", "PIL", "PIL.*", "uiautomation", "openpyxl", "openpyxl.*", "numpy", "cv2"]
ignore_missing_imports = true
